<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>BandoriLove · 角色控制台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/live2dcubismcore.min.js"></script>
  <script defer src="vendor/live2d.min.js"></script>
  <script defer src="vendor/pixi.min.js"></script>
  <script defer src="vendor/index.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="workspace">
    <header class="topbar">
      <a class="brand" href="/" aria-label="角色菜单首页"><img class="brand-mark" src="favicon.svg" alt=""><span>BandoriLove</span></a>
      <div class="breadcrumb"><span id="game-name">OurNotes</span><span class="slash">/</span><span id="band-name">MyGO!!!!!</span></div>
      <button id="connect" class="connection"><span class="status-dot"></span><span id="connect-label">连接桌面</span><span aria-hidden="true">↗</span></button>
    </header>
    <div class="content">
      <section class="character-heading"><h1 id="character-name">角色控制台</h1><p class="costume-caption" id="costume-caption"></p></section>
      <div class="studio-layout">
        <section class="stage" aria-label="Live2D 角色预览">
          <div class="stage-orbit orbit-one"></div><div class="stage-orbit orbit-two"></div><span class="stage-spark spark-one">✧</span><span class="stage-spark spark-two">✦</span>
          <div class="stage-label"><span class="live-dot"></span>预览<span id="model-loading" role="status">加载中</span></div>
          <div id="canvas-host"></div>
          <div class="stage-error" id="stage-error" hidden><span>◇</span><p>预览加载失败</p><button id="reload-preview">重新加载</button></div>
          <div class="subtitle" id="subtitle" hidden><span id="subtitle-speaker"></span><p id="subtitle-text"></p></div>
          <div class="stage-floor"></div>
        </section>
        <section class="control-panel" aria-label="角色操作">
          <div class="tabs" role="tablist" aria-label="内容类型">
            <button class="selected" id="tab-action" role="tab" aria-selected="true" data-tab="action">动作</button><button id="tab-expression" role="tab" aria-selected="false" data-tab="expression">表情</button><button id="tab-costume" role="tab" aria-selected="false" data-tab="costume">衣装</button><button id="tab-voice" role="tab" aria-selected="false" data-tab="voice">语音</button><button id="tab-favorites" role="tab" aria-selected="false" data-tab="favorites"><span>♥</span> 收藏</button>
          </div>
          <div class="panel-heading"><span id="item-count" class="count-label"></span></div>
          <div class="list-toolbar"><label class="search item-search"><span aria-hidden="true">⌕</span><input id="item-search" placeholder="搜索动作" aria-label="搜索当前列表"></label><button id="favorites-filter" class="heart-filter" aria-pressed="false"><span>♡</span>只看收藏</button><button id="clear-expression" class="subtle-button" hidden>清除表情</button></div>
          <div id="favorite-categories" class="filter-chips" hidden><button class="selected" data-filter="all">全部</button><button data-filter="action">动作</button><button data-filter="expression">表情</button><button data-filter="costume">衣装</button><button data-filter="voice">语音</button></div>
          <div id="items" class="items action-grid" role="tabpanel" aria-labelledby="tab-action"></div>
          <div id="empty" class="empty-state" hidden><span id="empty-icon">♡</span><h3 id="empty-title">暂无收藏</h3><button id="empty-reset" class="subtle-button" hidden>清除筛选</button></div>
          <div class="playback-bar" id="playback-bar"><div class="loop-options">
            <div class="order-setting"><span>播放顺序</span><div class="order-buttons" id="loop-order" role="group" aria-label="播放顺序"><button data-order="random" aria-pressed="true" class="selected">随机播放</button><button data-order="sequence" aria-pressed="false">按列表顺序</button></div></div>
            <label><span id="interval-label">结束后等待</span><span class="interval-input"><input id="loop-interval" type="number" min="0" max="3600" step="0.5" value="12" aria-label="循环间隔秒数"><span>秒</span></span></label>
          </div><div class="play-buttons"><button id="loop" class="primary-button"><span>↻</span><span id="loop-label">循环播放</span></button></div></div>
        </section>
      </div>
      <footer class="bottom-bar"><div class="now-playing"><span class="equalizer" id="equalizer"><i></i><i></i><i></i><i></i></span><div><strong id="playing-title">待机</strong><span id="playing-detail"></span></div></div><div class="quick-settings"><label class="setting-switch"><input id="captions-toggle" type="checkbox" checked><span class="switch-track"></span><span>语音字幕</span></label><label class="setting-switch"><input id="body-toggle" type="checkbox"><span class="switch-track"></span><span>互动仅♥</span></label><button id="stop-all" class="stop-button"><span>↺</span>恢复待机</button></div></footer>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
