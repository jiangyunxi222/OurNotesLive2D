<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>BandoriLove · 角色控制台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/rounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/sans-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=20261112-cleanup">
  <script defer src="vendor/live2dcubismcore.min.js"></script>
  <script defer src="vendor/live2d.min.js"></script>
  <script defer src="vendor/pixi.min.js"></script>
  <script defer src="vendor/index.min.js"></script>
  <script defer src="app.js?v=20261112-cleanup"></script>
</head>
<body>
  <main class="workspace">
    <header class="topbar">
      <a class="brand" href="/" aria-label="角色菜单首页"><img class="brand-mark" src="favicon.svg" alt=""><span>BandoriLove</span></a>
      <div class="breadcrumb"><span id="game-name">OurNotes</span><span class="slash">/</span><span id="band-name">MyGO!!!!!</span></div>
      <button id="import-role" class="connection" hidden>更换角色包</button>
      <button id="exit-preview" class="subtle-button" hidden>退出</button>
      <input id="role-zip" type="file" accept=".zip,application/zip" hidden>
      <button id="connect" class="connection"><span class="status-dot"></span><span id="connect-label">连接桌面</span><span aria-hidden="true">↗</span></button>
    </header>
    <section id="role-welcome" class="role-welcome" hidden><h1>导入角色包</h1><p>选择 BandoriLove 的单角色 ZIP，直接在网页预览。</p><button id="import-first-role" class="primary-button">选择 ZIP</button></section>
    <p id="role-import-status" class="role-import-status" role="status" hidden></p>
    <div class="content">
      <div class="studio-layout">
        <section class="stage" aria-label="Live2D 角色预览">
          <div class="stage-orbit orbit-one"></div><div class="stage-orbit orbit-two"></div><span class="stage-spark spark-one">✧</span><span class="stage-spark spark-two">✦</span>
          <span class="stage-label" id="model-loading" role="status">加载中</span>
          <div id="canvas-host"></div>
          <div class="stage-error" id="stage-error" hidden><span>◇</span><p>预览加载失败</p><button id="reload-preview">重新加载</button></div>
          <div class="subtitle" id="subtitle" hidden><span id="subtitle-speaker"></span><p id="subtitle-text"></p></div>
          <div class="stage-floor"></div>
        </section>
        <section class="control-panel" aria-label="角色操作">
          <div class="tabs" role="tablist" aria-label="内容类型">
            <button class="selected" id="tab-action" role="tab" aria-selected="true" data-tab="action">动作</button><button id="tab-expression" role="tab" aria-selected="false" data-tab="expression">表情</button><button id="tab-costume" role="tab" aria-selected="false" data-tab="costume">衣装</button><button id="tab-voice" role="tab" aria-selected="false" data-tab="voice">语音</button><button id="tab-favorites" role="tab" aria-selected="false" data-tab="favorites"><span>♥</span> 收藏</button>
            <span id="tab-indicator" class="tab-indicator" aria-hidden="true"></span>
          </div>
          <div class="list-toolbar"><label class="search item-search"><span aria-hidden="true">⌕</span><input id="item-search" placeholder="搜索动作" aria-label="搜索当前列表"></label><button id="favorites-filter" class="heart-filter" aria-label="只看收藏" aria-pressed="false"><span aria-hidden="true">♡</span></button><button id="clear-expression" class="subtle-button clear-expression-button" title="清除表情" aria-label="清除表情" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7-10 10H7l-4-4Z"/><path d="m8 10 7 6m-4 4h10"/></svg></button></div>
          <div id="favorite-categories" class="filter-chips" hidden><button class="selected" data-filter="all">全部</button><button data-filter="action">动作</button><button data-filter="expression">表情</button><button data-filter="costume">衣装</button><button data-filter="voice">语音</button></div>
          <div id="items" class="items action-grid" role="tabpanel" aria-labelledby="tab-action"></div>
          <div id="empty" class="empty-state" hidden><span id="empty-icon">♡</span><h3 id="empty-title">暂无收藏</h3><button id="empty-reset" class="subtle-button" hidden>清除筛选</button></div>
          <div class="playback-bar" id="playback-bar"><div class="loop-options">
            <div class="order-setting"><span>播放顺序</span><div class="order-buttons" id="loop-order" role="group" aria-label="播放顺序"><button data-order="random" aria-pressed="true" class="selected">随机播放</button><button data-order="sequence" aria-pressed="false">按列表顺序</button></div></div>
            <label><span id="interval-label">结束后等待</span><span class="interval-input"><input id="loop-interval" type="number" min="0" max="3600" step="0.5" value="12" aria-label="循环间隔秒数"><span>秒</span></span></label>
            <button id="upload-voice" class="voice-upload-button" aria-label="上传语音" hidden><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M11 20V8l9-2v11"/><ellipse cx="7.5" cy="20.5" rx="3.5" ry="2.5"/><ellipse cx="16.5" cy="17.5" rx="3.5" ry="2.5"/><path class="note-plus" d="M23 2v6m-3-3h6"/></svg></button>
          </div><div class="play-buttons"><button id="loop" class="primary-button"><span>↻</span><span id="loop-label">循环播放</span></button></div></div>
        </section>
      </div>
      <footer class="bottom-bar"><div class="now-playing"><span class="equalizer" id="equalizer"><i></i><i></i><i></i><i></i></span><div><strong id="playing-title">待机</strong><span id="playing-detail"></span></div></div><div class="quick-settings"><label class="setting-switch"><input id="captions-toggle" type="checkbox" checked><span class="switch-track"></span><span>语音字幕</span></label><label class="setting-switch"><input id="click-through-toggle" type="checkbox" checked><span class="switch-track"></span><span>防穿透</span></label><label class="setting-switch"><input id="body-toggle" type="checkbox"><span class="switch-track"></span><span>互动仅♥</span></label><button id="stop-all" class="stop-button"><span>↺</span>恢复待机</button></div></footer>
    </div>
  </main>
  <dialog id="voice-upload-dialog" class="voice-dialog" aria-labelledby="voice-upload-title">
    <form id="voice-upload-form">
      <div class="dialog-heading"><h2 id="voice-upload-title">上传语音</h2><button type="button" class="dialog-close" data-close-dialog aria-label="关闭">×</button></div>
      <label>音频<input id="voice-file" type="file" accept="audio/*,.flac,.m4a" required></label>
      <label>字幕<textarea id="voice-caption" rows="4" maxlength="2000" required></textarea></label>
      <p id="voice-upload-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="subtle-button" data-close-dialog>取消</button><button id="voice-upload-submit" type="submit" class="primary-button">上传</button></div>
    </form>
  </dialog>
  <dialog id="voice-delete-dialog" class="voice-dialog" aria-labelledby="voice-delete-title">
    <form id="voice-delete-form">
      <div class="dialog-heading"><h2 id="voice-delete-title">删除语音及字幕？</h2><button type="button" class="dialog-close" data-close-dialog aria-label="关闭">×</button></div>
      <p id="voice-delete-caption" class="delete-caption"></p>
      <p id="voice-delete-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="subtle-button" data-close-dialog>取消</button><button id="voice-delete-submit" type="submit" class="primary-button">删除</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
